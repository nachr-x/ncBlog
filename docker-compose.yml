services:
  # 本地开发
  hugo-dev:
    image: hugomods/hugo:debian-std-node-git-non-root-0.160.1
    command: server --bind 0.0.0.0 --baseURL http://localhost:1313 --buildDrafts --disableFastRender
    ports:
      - "1313:1313"
    volumes:
      - .:/src:z

  # 构建静态文件（一次性任务，不常驻）
  # 用法：docker compose --profile build run --rm hugo-build
  hugo-build:
    image: hugomods/hugo:debian-std-node-git-non-root-0.160.1
    command: --minify
    user: root
    volumes:
      - .:/src
    profiles:
      - build

  # 生产伺服
  # 用法：docker compose --profile prod up -d web
  web:
    image: caddy:alpine
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 114.114.114.114
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    profiles:
      - prod

volumes:
  caddy_data:
  caddy_config:
